services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ai-tools-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ai_tools
      MYSQL_USER: ai_tools
      MYSQL_PASSWORD: ai_tools123
    command: --innodb-buffer-pool-size=256M --max-connections=50
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # MinIO 文件存储
  minio:
    image: minio/minio:latest
    container_name: ai-tools-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Storage 服务 (Node.js - 文件上传)
  storage:
    build:
      context: ./storage
      dockerfile: Dockerfile
    container_name: ai-tools-storage
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      STORAGE_PORT: 9100
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: ai-tools
      MINIO_PUBLIC_URL: /minio
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_tools
      MYSQL_USER: ai_tools
      MYSQL_PASSWORD: ai_tools123
    depends_on:
      - minio
      - mysql
    restart: unless-stopped

  # API 服务 (Go - gRPC + HTTP)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ai-tools-api
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      GRPC_PORT: 8080
      HTTP_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_tools
      MYSQL_USER: ai_tools
      MYSQL_PASSWORD: ai_tools123
    depends_on:
      - mysql
    restart: unless-stopped

  # Web 前端 (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ai-tools-web
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      API_URL: http://api:8081
      MINIO_ORIGIN: http://localhost:9000
      MINIO_PUBLIC_URL: /minio
    depends_on:
      - api
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: ai-tools-nginx
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - minio
    restart: unless-stopped

volumes:
  minio_data:
  mysql_data:
