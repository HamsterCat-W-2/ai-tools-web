version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: ai-tools-minio
    ports:
      - "9000:9000"   # API端口
      - "9001:9001"   # 管理界面端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  storage:
    build:
      context: ./storage
      dockerfile: Dockerfile
    container_name: ai-tools-storage
    ports:
      - "9100:9100"
    environment:
      STORAGE_PORT: 9100
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: ai-tools
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  minio_data:
