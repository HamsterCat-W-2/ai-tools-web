<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- AI Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer circle - circuit board style -->
    <circle cx="20" cy="20" r="18" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <!-- Circuit nodes -->
    <circle cx="20" cy="2" r="2.5" fill="#3B82F6"/>
    <circle cx="36" cy="14" r="2.5" fill="#3B82F6"/>
    <circle cx="36" cy="28" r="2.5" fill="#3B82F6"/>
    <circle cx="20" cy="38" r="2.5" fill="#3B82F6"/>
    <circle cx="4" cy="28" r="2.5" fill="#3B82F6"/>
    <circle cx="4" cy="14" r="2.5" fill="#3B82F6"/>
    <!-- Inner brain shape -->
    <path d="M14 14 C14 10, 20 8, 20 12 C20 8, 26 10, 26 14 C28 14, 30 18, 28 20 C30 22, 28 26, 26 26 C26 30, 20 32, 20 28 C20 32, 14 30, 14 26 C12 26, 10 22, 12 20 C10 18, 12 14, 14 14Z" fill="#3B82F6" opacity="0.15"/>
    <path d="M14 14 C14 10, 20 8, 20 12 C20 8, 26 10, 26 14 C28 14, 30 18, 28 20 C30 22, 28 26, 26 26 C26 30, 20 32, 20 28 C20 32, 14 30, 14 26 C12 26, 10 22, 12 20 C10 18, 12 14, 14 14Z" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    <!-- Neural connections -->
    <line x1="20" y1="12" x2="20" y2="28" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="14" y1="18" x2="26" y2="18" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="14" y1="22" x2="26" y2="22" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="2" fill="#3B82F6"/>
  </g>
  <!-- Text -->
  <text x="52" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#111827">
    AI Tools
  </text>
  <text x="52" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" letter-spacing="0.5px">
    AI TOOLS NAVIGATION
  </text>
</svg>
