<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- AI Icon - cyan accent on dark -->
  <g transform="translate(4, 6)">
    <!-- Outer circle -->
    <circle cx="18" cy="18" r="16" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
    <!-- Circuit nodes -->
    <circle cx="18" cy="2" r="2" fill="#00d4ff"/>
    <circle cx="32" cy="12" r="2" fill="#00d4ff"/>
    <circle cx="32" cy="26" r="2" fill="#00d4ff"/>
    <circle cx="18" cy="34" r="2" fill="#00d4ff"/>
    <circle cx="4" cy="26" r="2" fill="#00d4ff"/>
    <circle cx="4" cy="12" r="2" fill="#00d4ff"/>
    <!-- Inner brain shape -->
    <path d="M12 12 C12 8, 18 6, 18 10 C18 6, 24 8, 24 12 C26 12, 28 16, 26 18 C28 20, 26 24, 24 24 C24 28, 18 30, 18 26 C18 30, 12 28, 12 24 C10 24, 8 20, 10 18 C8 16, 10 12, 12 12Z" fill="#00d4ff" opacity="0.08"/>
    <path d="M12 12 C12 8, 18 6, 18 10 C18 6, 24 8, 24 12 C26 12, 28 16, 26 18 C28 20, 26 24, 24 24 C24 28, 18 30, 18 26 C18 30, 12 28, 12 24 C10 24, 8 20, 10 18 C8 16, 10 12, 12 12Z" stroke="#00d4ff" stroke-width="1.2" fill="none"/>
    <!-- Neural connections -->
    <line x1="18" y1="10" x2="18" y2="26" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="12" y1="16" x2="24" y2="16" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="12" y1="20" x2="24" y2="20" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <!-- Center dot -->
    <circle cx="18" cy="18" r="1.5" fill="#00d4ff"/>
  </g>
  <!-- Text -->
  <text x="50" y="30" font-family="Newsreader, Georgia, serif" font-size="22" font-weight="600" fill="#e8ecf4" letter-spacing="-0.02em">
    AI Tools
  </text>
  <text x="50" y="42" font-family="DM Sans, system-ui, sans-serif" font-size="9" fill="#4a5d7a" letter-spacing="1.5px" font-weight="500">
    NAVIGATION
